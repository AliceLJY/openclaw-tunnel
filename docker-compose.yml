# openclaw-tunnel — Docker Compose
#
# Deployment scenarios:
#   A) Local:  task-api in Docker on your machine, runner on the host (default)
#   B) Cloud:  task-api on a cloud VM, runner connects through HTTPS, a VPN,
#              or an SSH tunnel. Never expose this port as plaintext public HTTP.
#   C) Remote: Keep task-api on loopback or a private network. Hosting location
#              alone does not establish compliance.
#
# Security: WORKER_TOKEN authenticates requests but does not encrypt traffic.
# For remote deployment, use a TLS reverse proxy, VPN bind, or SSH tunnel.
# A firewall is defense in depth, not transport encryption.

services:
  task-api:
    build:
      context: ./task-api
      dockerfile: Dockerfile
    ports:
      # Loopback by default. For VPN access, bind TASK_API_BIND to the VPN interface only.
      - "${TASK_API_BIND:-127.0.0.1}:${PORT:-3456}:${PORT:-3456}"
    environment:
      - WORKER_TOKEN=${WORKER_TOKEN}
      - PORT=${PORT:-3456}
      - CALLBACK_BOT_TOKEN=${CALLBACK_BOT_TOKEN}
      - CALLBACK_API_BASE_URL=${CALLBACK_API_BASE_URL:-https://discord.com/api/v10}
      - CALLBACK_CHANNEL=${CALLBACK_CHANNEL:-}
      - WORKER_TASK_DB=/data/tasks.db
    volumes:
      - tunnel-data:/data    # Persistent storage for task DB + event DB
      - type: bind
        source: ${CLAUDE_PROJECTS_DIR:?run setup.sh or set CLAUDE_PROJECTS_DIR}
        target: /host-claude-projects
        read_only: true
      - type: bind
        source: ${CODEX_SESSIONS_DIR:?run setup.sh or set CODEX_SESSIONS_DIR}
        target: /host-codex-sessions
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${PORT:-3456}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tunnel-data:
